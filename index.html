<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProjectHub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#172033;font:15px Arial,sans-serif}header{background:#172554;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1000px;margin:22px auto;padding:0 14px}.card,.project{background:white;border:1px solid #e1e7f0;border-radius:12px;padding:16px;margin:12px 0}button{border:0;border-radius:8px;padding:10px 14px;background:#315efb;color:white;margin:4px;cursor:pointer}.secondary{background:#e8edfc;color:#2447bb}.danger{background:#c0394b}.good{background:#12845b}input,textarea{display:block;width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd5e4;border-radius:8px}label{font-weight:bold}.tabs{display:flex;flex-wrap:wrap;gap:5px}.hidden{display:none}footer{text-align:center;color:#687386;padding:28px}.muted{color:#687386}.pill{background:#edf1f8;border-radius:20px;padding:4px 9px;font-size:12px}
</style></head><body>
<header><div><h1>ProjectHub</h1><div>Collaborate. Build. Learn. Grow.</div></div><div id="who"></div></header>
<main><section id="auth" class="card"><h2>Welcome to ProjectHub</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="login">Login</button><button id="signup" class="secondary">Student Sign Up</button><p id="authmsg"></p></section>
<section id="app" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="heading">Dashboard</h2><button id="logout" class="secondary">Logout</button></div><div id="tabs" class="tabs"></div><div id="content"></div></section></main>
<footer>Website created by Kartik Jalke ✨</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDCb4mF80vHlW1FtQIbuo3o9ESRtvlMLc",authDomain:"new-projecthub.firebaseapp.com",projectId:"new-projecthub",storageBucket:"new-projecthub.firebasestorage.app",messagingSenderId:"901069289222",appId:"1:901069289222:web:2f19a4ec67ed8294e41087"});
const auth=firebase.auth(),db=firebase.firestore(),ADMIN_UID="wmPUWhoSpycD4ReHIVvh8caDmfq2";let user,profile,admin=false,tab="Projects",projects=[];
const $=x=>document.getElementById(x),safe=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function button(t,a,c=""){return `<button class="${c}" data-a="${a}">${t}</button>`}
$("login").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(e){$("authmsg").textContent=e.message}};
$("signup").onclick=async()=>{try{let c=await auth.createUserWithEmailAndPassword($("email").value.trim(),$("password").value);await db.collection("users").doc(c.user.uid).set({email:c.user.email,name:c.user.email.split("@")[0],branch:"",role:"student",status:"pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()});$("authmsg").textContent="Signup complete. Wait for Admin approval."}catch(e){$("authmsg").textContent=e.message}};
$("logout").onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{user=u;if(!u){$("auth").classList.remove("hidden");$("app").classList.add("hidden");return}try{let r=db.collection("users").doc(u.uid),s=await r.get();if(!s.exists){await r.set({email:u.email,name:u.email.split("@")[0],role:"student",status:"pending"});s=await r.get()}profile=s.data();admin=u.uid===ADMIN_UID||profile.role==="admin";$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=profile.name||u.email;$("heading").textContent=admin?"Admin Dashboard":"Student Dashboard";if(!admin&&profile.status!=="approved"){$("tabs").innerHTML="";$("content").innerHTML="<div class='card'><h3>Account pending approval</h3>Please wait for Admin approval.</div>";return}await loadProjects();showTab(admin?"Admin Panel":"Projects")}catch(e){$("content").textContent=e.message}});
async function loadProjects(){let s=await db.collection("projects").orderBy("createdAt","desc").get();projects=s.docs.map(d=>({id:d.id,...d.data()}))}
function showTab(t){tab=t;let list=admin?["Projects","Admin Panel"]:["Projects","My Projects","My Profile","My Certificates"];$("tabs").innerHTML=list.map(x=>button(x,"tab:"+x,x===t?"":"secondary")).join("");render()}
function render(){if(tab==="Projects")renderProjects();if(tab==="Admin Panel"&&admin)renderAdmin();if(tab==="My Projects")renderMine();if(tab==="My Profile")renderProfile();if(tab==="My Certificates")renderCerts()}
$("tabs").onclick=e=>{if(e.target.dataset.a?.startsWith("tab:"))showTab(e.target.dataset.a.slice(4))};
function renderProjects(){let unique=[...new Map(projects.map(p=>[`${(p.title||"").toLowerCase()}|${(p.category||"").toLowerCase()}`,p])).values()];$("content").innerHTML="<div class='card'><h2>Available Projects</h2>"+unique.map(p=>`<div class="project"><h3>${safe(p.title)}</h3><span class="pill">${safe(p.category)}</span><p>${safe(p.description)}</p><div id="r${p.id}">Loading response…</div></div>`).join("")+"</div>";unique.forEach(async p=>{try{let s=await db.collection("projects").doc(p.id).collection("responses").doc(user.uid).get(),v=s.exists?s.data().status:"";let el=$("r"+p.id);if(el)el.innerHTML=`Response: <b>${safe(v||"Not selected")}</b><br>${button(v==="Interested"?"Interested ✓":"Interested","respond:"+p.id+":Interested,v==="Interested"?"good":"")}${button(v==="Not Interested"?"Not Interested ✓":"Not Interested","respond:"+p.id+":Not Interested",v==="Not Interested"?"danger":"secondary")}`}catch(e){let el=$("r"+p.id);if(el)el.textContent=e.message}})}
async function renderMine(){let out="<div class='card'><h2>My Projects</h2>";for(let p of projects){let s=await db.collection("projects").doc(p.id).collection("responses").doc(user.uid).get();if(s.exists&&s.data().status==="Interested")out+=`<div class="project"><b>${safe(p.title)}</b><p>${safe(p.description)}</p><span class="pill">Interested</span></div>`}$("content").innerHTML=out+"</div>"}
function renderProfile(){$("content").innerHTML=`<div class="card"><h2>My Profile</h2><label>Name</label><input id="nm" value="${safe(profile.name)}"><label>Branch</label><input id="br" value="${safe(profile.branch)}"><label>Email</label><input disabled value="${safe(user.email)}"><button id="save">Save Profile</button></div>`;$("save").onclick=async()=>{await db.collection("users").doc(user.uid).update({name:$("nm").value,branch:$("br").value});profile.name=$("nm").value;profile.branch=$("br").value;alert("Profile updated")}}
async function renderCerts(){let s=await db.collection("users").doc(user.uid).collection("certificates").get();$("content").innerHTML="<div class='card'><h2>My Certificates</h2>"+(s.docs.map(d=>`<p>${safe(d.data().title)} — <a href="${safe(d.data().url)}" target="_blank">Download</a></p>`).join("")||"No certificates yet.")+"</div>"}
async function renderAdmin(){let s=await db.collection("users").get(),students=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.role!=="admin");$("content").innerHTML=`<div class="card"><h2>Create Project</h2><label>Title</label><input id="pt"><label>Category</label><input id="pc"><label>Description</label><textarea id="pd"></textarea><button id="create">Create Project</button></div><div class="card"><h2>Manage Projects</h2>${projects.map(p=>`<div class="project"><b>${safe(p.title)}</b><p>${safe(p.category)}</p>${button("Edit","edit:"+p.id,"secondary")}${button("Delete Project","delproj:"+p.id,"danger")}</div>`).join("")}</div><div class="card"><h2>Student Approval & Management</h2>${students.map(x=>`<div class="project"><b>${safe(x.name||x.email)}</b> <span class="pill">${safe(x.status||"pending")}</span><p>${safe(x.email)} · ${safe(x.branch)}</p>${x.status!=="approved"?button("Approve","approve:"+x.id,"good"):""}${button("Remove Student","delstudent:"+x.id,"danger")}</div>`).join("")}</div><div class="card"><h2>Project Participation</h2><div id="part">Loading…</div></div>`;
$("create").onclick=async()=>{let title=$("pt").value.trim();if(!title)return alert("Enter title");await db.collection("projects").add({title,category:$("pc").value,description:$("pd").value,createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:user.uid});await loadProjects();renderAdmin()};
let participation="";for(let p of projects){let rs=await db.collection("projects").doc(p.id).collection("responses").get();participation+=`<div class="project"><b>${safe(p.title)}</b><p>${rs.docs.map(d=>safe(d.data().name||d.data().email||d.id)+": "+safe(d.data().status)).join("<br>")||"No responses"}</p></div>`}$("part").innerHTML=participation||"No projects yet."}
$("content").onclick=async e=>{let a=e.target.dataset.a;if(!a)return;let [act,id,val]=a.split(":");try{if(act==="respond"){await db.collection("projects").doc(id).collection("responses").doc(user.uid).set({uid:user.uid,name:profile.name||"",email:user.email,status:val,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await loadProjects();renderProjects()}if(act==="approve"){await db.collection("users").doc(id).update({status:"approved"});renderAdmin()}if(act==="delstudent"&&confirm("Remove this student's profile? Login account remains.")){await db.collection("users").doc(id).delete();renderAdmin()}if(act==="delproj"&&confirm("Delete project and all its responses?")){let ref=db.collection("projects").doc(id),rs=await ref.collection("responses").get(),batch=db.batch();rs.docs.forEach(d=>batch.delete(d.ref));batch.delete(ref);await batch.commit();await loadProjects();renderAdmin()}if(act==="edit"){let p=projects.find(x=>x.id===id),title=prompt("Project title",p.title);if(title===null)return;let category=prompt("Category",p.category||"");if(category===null)return;let description=prompt("Description",p.description||"");if(description===null)return;await db.collection("projects").doc(id).update({title,category,description});await loadProjects();renderAdmin()}}catch(err){alert("Error: "+err.message)}};
</script></body></html>
